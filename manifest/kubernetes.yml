# MINIKUBE FUNCIONA EN CODESPACE | LOCAL
# KUBECTL FUNCIONA DIRECTO EN KILLERCODA (SIN MINIKUBE)

# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingresar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# crear un namespace "leandro" por comando mediante un archivo: "leandro-cahuana-04-namespace.yml"
kubectl apply -f leandro-cahuana-04-namespace.yml

# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "leandro-cahuana-04-namespace"
kubectl config set-context --current --namespace=leandro-cahuana-04-namespace

# consultar todos los recursos de un namespace "leandro-cahuana-04-namespace"
kubectl get all -n leandro-cahuana-04-namespace

# consultar todos los recursos y secret de un namespace "leandro-cahuana-04-namespace"
kubectl get all,secrets -n leandro-cahuana-04-namespace


# listar services del namespace "leandro-cahuana-04-namespace"
minikube service leandro-cahuana-04-service -n leandro-cahuana-04-namespace
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/api1/transcripcion/69d89d0b151d14d9041d15b2

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/leandro-cahuana-04-service 8085:30001